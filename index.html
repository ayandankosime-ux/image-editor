<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capcut Lite</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="logo-container">
      <img class="logo-image" src="images/587438345192379763.jpeg">
      <h1>CapCut Lite</h1>
    </div>
    <p>React - Image Editor</p>
  </header>

  <main>
    <div class="app-container">
      <div class="image-upload-container">
        <p class="canvas-text">
          canvas
        </p>
        <div class="upload-box">
          <div class="uploaded-box js-uploaded-box not-visible">
            <img src="images/accept-check-good-mark-ok-tick-svgrepo-com.svg" class="done-icon">
            <p>Uploaded</p>
          </div>
          <input type="file" id="fileInput" hidden>
          <img id="previewImage" class="uploaded-image" src="">
          <button class="btn3 btn-upload-image js-btn-upload-image">Upload Image</button>
        </div>

        <div class="notification-container js-notification-container">
          <p class="notification-text js-notification-text"></p>
          <div class="button-container">
            <button 
              class="btn btn-replace 
              js-btn-replace"
            >
              Replace
            </button>
            <button class="btn btn-remove js-btn-remove">
              Remove
            </button>
          </div>
        </div>
      </div>

      <div class="image-editor-container">
        <h2>Adjustments</h2>

        <div class="adjustment-controls-container">
          <h3>Brightness</h3>
          <input type="range" id="brightness" min="0" max="200" value="100">
          <div class="brightness-amount amount">
            <p class="amount-text js-brightness-amount">100</p>
          </div>

          <h3>Contrast</h3>
          <input type="range" id="contrast" min="0" max="200" value="100">
          <div class="contrast-amount amount">
            <p class="amount-text js-contrast-amount">100</p>
          </div>

          <h3>Blur</h3>
          <input type="range" id="blur" min="0" max="10" value="0">
          <div class="blur-amount amount">
            <p class="amount-text js-blur-amount">0</p>
          </div>

          <h3>Grayscale</h3>
          <input type="range" id="grayscale" min="0" max="100" value="0">
          <div class="grayscale-amount amount">
            <p class="amount-text js-grayscale-amount">0</p>
          </div>
        </div>
        <div class="download-reset-container">
          <button class="btn3 btn-reset js-btn-reset">Reset</button>
          <button class="btn3 btn-download js-btn-download">Download</button>
        </div>
      </div>
    </div>
  </main>

  <script src="scripts/data.js"></script>
  <script src="scripts/adjustments.js"></script>
</body>

</html>
