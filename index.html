<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capcut Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img class="logo-image" src="images/587438345192379763.jpeg">
      <h1>CapCut Lite</h1>
    </div>
    <p>React - Image Editor</p>
  </header>

  <main>
    <div class="app-container">
      <div class="image-upload-container">
        <p class="canvas-text">
          canvas
        </p>
        <div class="upload-box">
          <div class="uploaded-box">
            <p>Uploaded</p>
          </div>
          <img class="uploaded-image" src="images/⌗.jpeg">
        </div>

        <div class="notification-container">
          <p class="notification-text">
            uploaded-photo.jpg - 1920x1260 - 1.2 MB
          </p>
          <div class="button-container">
            <button class="btn btn-replace">Replace</button>
            <button class="btn btn-remove">
              Remove
            </button>
          </div>
        </div>
      </div>

      <div class="image-editor-container">
        <h2>Adjustments</h2>

        <div class="adjustment-controls-container">
          <h3>Brightness</h3>
          <input type="range">
          <div class="brightness-amount amount">
            <p class="amount-text">12</p>
          </div>

          <h3>Contrast</h3>
          <input type="range">
          <div class="contrast-amount amount">
            <p class="amount-text">-8</p>
          </div>

          <h3>Blur</h3>
          <input type="range">
          <div class="blur-amount amount">
            <p class="amount-text">10</p>
          </div>

          <h3>Brightness</h3>
          <input type="range">
          <div class="brightness-amount amount">
            <p class="amount-text">55</p>
          </div>
        </div>
        <div class="download-reset-container">
          <button class="btn3 btn-reset">Reset</button>
          <button class="btn3 btn-download">Download</button>
        </div>
      </div>
    </div>
    
  </main>

</body>
</html>
